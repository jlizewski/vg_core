syntax = "proto3";

package vg;

import "google/protobuf/timestamp.proto";

// One per capture session, written first on /vg/session.
message SessionInfo {
  // Capture format version, "MAJOR.MINOR". Same as the vg_capture metadata record.
  string format_version = 1;

  // Producing software and version, e.g. "vg_android 0.3.0".
  string producer = 2;

  // Source platform: "arcore", "arkit", "rig", ...
  string platform = 3;

  // Hardware model, e.g. "Pixel 8 Pro".
  string device_model = 4;

  // Session start on the session clock.
  google.protobuf.Timestamp start_time = 5;

  // UTC time = session clock time + utc_offset_ns.
  int64 utc_offset_ns = 6;

  // Free-form notes (garden name, operator, ...).
  string notes = 7;
  // What the session is for, in guided mapping (docs/design/guided-mapping.md):
  // "boundary_walk", "ground_fill", "skyline_station", "structure_station",
  // "canopy_station" or "relocalization". Empty for a free walk. (Since 0.2.)
  string session_type = 8;
  // The tracker's world frame: recordings with the same value were made in
  // one continuous tracking session (the AR session never restarted and its
  // tracking never reset), so their poses share one world frame and need no
  // registration between them. Empty if unknown. Any unique string, e.g. a
  // UUID made when the AR session starts. (Since 0.2.)
  string tracking_frame = 9;
}
