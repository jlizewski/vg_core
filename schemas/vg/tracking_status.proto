syntax = "proto3";

package vg;

import "google/protobuf/timestamp.proto";

// State of the platform tracker, published on /pose/status when it changes.
message TrackingStatus {
  enum State {
    UNKNOWN = 0;
    NORMAL = 1;
    LIMITED = 2;
    LOST = 3;
  }

  google.protobuf.Timestamp timestamp = 1;
  State state = 2;

  // Platform-specific reason, e.g. "insufficient_features", "excessive_motion".
  string reason = 3;
}
