syntax = "proto3";

package vg;

import "google/protobuf/timestamp.proto";

message Vector3 {
  double x = 1;
  double y = 2;
  double z = 3;
}

// One gyroscope + accelerometer sample, published on /imu.
message Imu {
  google.protobuf.Timestamp timestamp = 1;

  // Frame the sample is expressed in, normally "body".
  string frame_id = 2;

  // Angular velocity in rad/s.
  Vector3 angular_velocity = 3;

  // Specific force in m/s^2 (includes gravity, as reported by the sensor).
  Vector3 linear_acceleration = 4;

  // Row-major 3x3 covariances. Empty if unknown.
  repeated double angular_velocity_covariance = 5;
  repeated double linear_acceleration_covariance = 6;
}
