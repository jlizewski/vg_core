# vg_core mapping settings: every tunable parameter of the map package pipeline,
# with its default.
#
# Use with vg replay or vg map: --config FILE (a file only needs the settings it
# changes), --set PATH=VALUE (e.g. --set ground.max_slope=0.6), or a setting's
# short flag (vg replay --help). `auto` leaves a value to be worked out.
#
# Generated by `vg config defaults > config/mapping.yaml`; regenerate it after
# adding a setting.

# Derived stages vg replay runs after building the 3D map, in order (and vg
# map's `all`). Stages: voxels, surface, ground, sun, semantic, layers.
pipeline: [voxels, surface, ground, sun, semantic]

# The map package as a whole.
map:
  # Cell size of the 2D maps (surface, ground, sun), in meters. 0.1524 is 6
  # inches.
  resolution: 0.1524

# Replaying the recording into the 3D map. Only vg replay reads these: changing
# them needs a rebuild.
build:
  # Edge of a 3D voxel, in meters. auto: half the resolution, so thin things
  # like stems and posts still show.
  voxel_size: auto
  # TSDF truncation distance, in meters. auto: 3 voxels.
  truncation: auto
  # Place new voxel blocks from every Nth depth pixel in each direction (every
  # pixel is still fused).
  pixel_stride: 2
  # Threads fusing each frame; 0 uses all.
  threads: 0
  # Fuse a frame only once the camera has moved this far since the last one
  # fused, in meters. 0, with keyframe_angle 0, fuses every frame: slower, but
  # averages out more noise.
  keyframe_distance: 0
  # ... or turned this much, in degrees.
  keyframe_angle: 0
  # Playback speed: 0 as fast as possible, 1 real time printing the map's
  # progress.
  rate: 0
  # Fuse only depth taken from this time on, in seconds from the first sensor
  # reading (as vg mcap stats prints times).
  from: 0
  # ... and up to this time. auto: the end of the session.
  to: auto
  # Which depth readings are fused.
  depth:
    # Nearest reading used, in meters.
    min_depth: 0.1
    # Farthest reading used, in meters. Phone depth error grows with the square
    # of range.
    max_depth: 3.5
    # Readings less confident than this (0-255) are dropped, when the depth has
    # confidence.
    min_confidence: 0
    # Readings differing from a neighbor by more than this fraction of their
    # depth are on a depth edge, where depth smears between surfaces, and are
    # dropped. 0 keeps them.
    edge_ratio: 0.05
    # Surfaces seen more than this many degrees from head-on are dropped. 90
    # keeps them.
    max_incidence_deg: 75
  # How readings are fused into the voxels.
  fusion:
    # Weight each reading by its confidence x (reference_depth / depth)^2 x the
    # cosine of its viewing angle, instead of 1.
    quality_weights: true
    # Depth at which a head-on, fully confident reading weighs 1, in meters.
    reference_depth: 1
    # Cap on a voxel's fused weight, so the map can still change.
    max_weight: 64
    # Mark the space each ray passes through as empty, so a blob from a bad
    # reading fades once later frames look through it.
    carve: true
    # Carve along the rays of every Nth depth pixel in each direction.
    carve_stride: 4
  # Undoing the tracker's pose jumps: ARCore snaps its pose to correct its
  # drift, and the walk on either side of a snap would map as ghost copies.
  pose_jumps:
    # Undo pose jumps.
    enabled: true
    # Moving faster than this between two poses is a jump, in m/s.
    max_speed: 2
    # ... or turning faster than this, in degrees/s.
    max_turn_rate: 180
    # Jumps smaller than this are ignored, in meters.
    min_translation: 0.03
    # ... and than this, in degrees.
    min_rotation: 3
  # Semantic labels recorded with the depth (depth/labels, from a segmentation
  # model).
  semantics:
    # Count, per voxel, the classes it was seen as, so the map knows what things
    # are.
    label_votes: true
    # Readings labeled with these classes are left out of the map: people and
    # animals move, and depth on the sky is noise. Classes: unknown, ground,
    # plant, tree, structure, sky, dynamic.
    drop_classes: [dynamic, sky]

# Reading the 3D map out for every derived map. vg map can re-tune these without
# a rebuild.
voxels:
  # Fused weight a voxel needs to count. auto: min_weight_with_confidence or
  # min_weight_without_confidence, whichever suits the depth (picked by the
  # build).
  min_weight: auto
  # auto min_weight for depth with confidence (ARCore raw depth): most of its
  # readings are low confidence, so weigh little.
  min_weight_with_confidence: 0.05
  # auto min_weight for depth without confidence (smoothed depth).
  min_weight_without_confidence: 0.5
  # Groups of voxels connected to nothing else smaller than this, in cubic
  # meters, are specks and left out. 0 keeps them.
  min_blob_volume: 0.01

# The 2D maps derived from the 3D map.
maps:
  # Cell size of the surface, ground and layers maps, in meters. auto: the
  # package's map.resolution.
  cell_size: auto

# Separating the ground from what stands on it (ground.asc, objects.ply).
ground:
  # Steepest ground, as rise over run (1.0 = 45 degrees).
  max_slope: 1
  # Extra height step allowed between neighboring ground columns, in meters.
  step_tolerance: 0.03
  # Ground patches separated by unseen space are joined if they line up within
  # this, in meters.
  max_gap: 0.5
  # A ground patch with nothing to join is still ground if at least this big, in
  # square meters.
  min_isolated_area: 0.5
  # Unseen holes in the ground up to this big are patched, in square meters
  # (holes under objects always are).
  max_hole_area: 1

# Hours of direct sun and clear-sky energy per ground cell over a year.
sun:
  # Year to simulate. auto: the current one.
  year: auto
  # Minutes between sun positions.
  step_minutes: 60
  # The map's latitude, in degrees. auto: from the session's GPS.
  latitude: auto
  # The map's longitude, in degrees. auto: from the session's GPS.
  longitude: auto
  # Compass bearing of the map's +x axis, in degrees clockwise from north. auto:
  # from the GPS track and the poses.
  x_bearing_deg: auto
  # Height above the ground the sun rays start from, in meters. auto: one voxel,
  # at least 4 cm.
  sample_height: auto
  # The sun counts only when at least this many degrees up.
  min_elevation_deg: 0

# Reading the semantic labels out (labels.ply, semantic.asc).
semantics:
  # Votes a voxel's class needs to count; with fewer it's unknown.
  min_votes: 2

# Diagnostic: where a second surface sits over the first (ghosts).
layers:
  # Runs of voxels separated by fewer empty voxels than this count as one
  # surface.
  min_gap_voxels: 2
