[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vg-tools"
version = "0.1.0"
description = "Development tools for vg_core"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
schemas = ["grpcio-tools>=1.60"]
# Reading recordings (vg labels, ...): MCAP with zstd chunks, images and arrays.
analysis = ["mcap>=1.2", "mcap-protobuf-support>=0.5", "numpy>=1.26", "pillow>=10"]

[project.scripts]
vg = "vg_tools.cli:main"

[tool.setuptools.packages.find]
include = ["vg_tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
